<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Простая бродилка</title>
  <style>
    body { margin: 0; overflow: hidden; background: #1a1a2e; color: white; font-family: sans-serif; }
    #game { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; }
    canvas { display: block; }
    #ui { position: absolute; top: 10px; left: 10px; pointer-events: none; }
    .panel {
      background: rgba(0,0,0,0.6); padding: 12px; border-radius: 8px;
      max-width: 320px; margin-bottom: 10px;
    }
    input, button {
      padding: 6px 10px; border: none; border-radius: 4px;
      background: #fff; color: #000; font-size: 14px; width: 100%; box-sizing: border-box;
      margin-top: 6px;
    }
    button { cursor: pointer; background: #e94560; color: white; }
    button:hover { background: #d0354d; }
    #status { margin-top: 8px; font-size: 13px; color: #ccc; }
  </style>
</head>
<body>
  <div id="ui">
    <div id="lobby" class="panel">
      <h3>Мультиплеер</h3>
      <p>Выберите режим:</p>
      <button id="btn-create">Создать комнату</button>
      <div style="margin-top:12px;">
        <label>Код комнаты:</label>
        <input type="text" id="room-code" placeholder="Код (например, ABC12)" />
        <button id="btn-join">Присоединиться</button>
      </div>
      <div id="status"></div>
    </div>

    <div id="game-ui" class="panel" style="display:none;">
      <h3>Игра</h3>
      <p id="room-info">Комната: —</p>
      <p>Управление: WASD / стрелки</p>
      <button id="btn-leave">Выйти в лобби</button>
    </div>
  </div>
  <div id="game"><canvas id="c"></canvas></div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- Мир ---
    const worldSize = 3000;
    const tileSize = 64;
    const tiles = [];
    for (let x = -10; x < 10; x++) {
      for (let y = -10; y < 10; y++) {
        const type = Math.random() < 0.15 ? 'tree' : (Math.random() < 0.2 ? 'bush' : 'grass');
        tiles.push({ x, y, type });
      }
    }

    // --- Игрок ---
    let player = { x: 0, y: 0, color: `hsl(${Math.random()*360},70%,50%)` };
    const speed = 4;

    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    function updatePlayer() {
      if (keys['KeyW'] || keys['ArrowUp']) player.y -= speed;
      if (keys['KeyS'] || keys['ArrowDown']) player.y += speed;
      if (keys['KeyA'] || keys['ArrowLeft']) player.x -= speed;
      if (keys['KeyD'] || keys['ArrowRight']) player.x += speed;

      // Ограничение мира
      player.x = Math.max(-worldSize/2, Math.min(worldSize/2, player.x));
      player.y = Math.max(-worldSize/2, Math.min(worldSize/2, player.y));
    }

    // --- Мультиплеер ---
    let peer = null;
    let conn = null;
    let otherPlayers = {}; // id -> {x,y,color}

    function setStatus(text, color = '#ccc') {
      const el = document.getElementById('status');
      el.textContent = text;
      el.style.color = color;
    }

    async function createRoom() {
      peer = new Peer();
      peer.on('open', id => {
        setStatus(`Ваш ID: ${id} (покажите друзьям)`, '#e94560');
        document.getElementById('room-code').value = id;
      });
      peer.on('connection', c => {
        conn = c;
        handleConnection(c);
      });
    }

    async function joinRoom(id) {
      peer = new Peer();
      peer.on('open', () => {
        conn = peer.connect(id);
        handleConnection(conn);
      });
      peer.on('error', err => setStatus('Ошибка соединения', 'red'));
    }

    function handleConnection(c) {
      c.on('data', data => {
        if (data.type === 'pos') {
          otherPlayers[c.peer] = { x: data.x, y: data.y, color: data.color };
        }
      });

      setStatus('Подключено!', '#4ade80');
      switchUI(false);

      // Отправка позиции
      setInterval(() => {
        if (conn && conn.open) {
          conn.send({ type: 'pos', x: player.x, y: player.y, color: player.color });
        }
      }, 100);
    }

    function switchUI(inLobby) {
      document.getElementById('lobby').style.display = inLobby ? 'block' : 'none';
      document.getElementById('game-ui').style.display = inLobby ? 'none' : 'block';
      if (!inLobby) document.getElementById('room-info').textContent = 'Комната: ' + (conn ? conn.peer : '—');
    }

    document.getElementById('btn-create').onclick = () => createRoom();
    document.getElementById('btn-join').onclick = () => {
      const code = document.getElementById('room-code').value.trim();
      if (!code) return setStatus('Введите код комнаты', 'red');
      joinRoom(code);
    };
    document.getElementById('btn-leave').onclick = () => {
      conn?.close();
      peer?.destroy();
      conn = null; peer = null; otherPlayers = {};
      switchUI(true);
      setStatus('');
    };

    // --- Отрисовка ---
    function draw() {
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const camX = -player.x + canvas.width / 2;
      const camY = -player.y + canvas.height / 2;

      ctx.save();
      ctx.translate(camX, camY);

      // Мир
      for (const t of tiles) {
        ctx.fillStyle = t.type === 'tree' ? '#228B22' : (t.type === 'bush' ? '#32CD32' : '#2E8B57');
        ctx.fillRect(t.x * tileSize, t.y * tileSize, tileSize, tileSize);
        if (t.type === 'tree') {
          ctx.fillStyle = '#8B4513';
          ctx.fillRect(t.x * tileSize + 16, t.y * tileSize + 32, 32, 32);
        }
      }

      // Другие игроки
      for (const [id, p] of Object.entries(otherPlayers)) {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 12, 0, Math.PI*2);
        ctx.fill();
        // обводка, чтобы было видно
        ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
      }

      // Свой игрок
      ctx.fillStyle = player.color;
      ctx.beginPath();
      ctx.arc(player.x, player.y, 12, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();

      ctx.restore();

      requestAnimationFrame(draw);
    }

    function gameLoop() {
      updatePlayer();
      draw();
      requestAnimationFrame(gameLoop);
    }

    switchUI(true);
    gameLoop();
  </script>
</body>
</html>
