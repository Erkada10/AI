<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Бродилка</title>
  <style>
    html, body { margin:0; height:100%; overflow:hidden; background:#1a1a2e; color:#fff;
                 font-family:sans-serif; touch-action:none; -webkit-user-select:none; user-select:none; }
    canvas { display:block; position:fixed; inset:0; }
    #panel { position:fixed; top:58px; left:14px; background:rgba(0,0,0,.78); padding:14px;
             border-radius:10px; max-width:300px; width:calc(100% - 28px); box-sizing:border-box; }
    #btn-toggle { position:fixed; top:14px; left:14px; z-index:5; padding:8px 14px; border:none;
                  border-radius:8px; background:#e94560; color:#fff; font-size:18px; cursor:pointer; }
    input, button.f { padding:10px; border:none; border-radius:6px; font-size:15px;
                      width:100%; box-sizing:border-box; margin-top:8px; }
    input { background:#fff; color:#000; }
    button.f { cursor:pointer; background:#e94560; color:#fff; }
    #btn-exit { background:#555 !important; }
    #status { margin-top:8px; font-size:13px; color:#ccc; min-height:16px; }
    #code-line { display:none; margin-top:8px; font-size:22px; font-weight:bold;
                 letter-spacing:3px; color:#4ade80; }
    #joystick { position:fixed; bottom:34px; left:24px; width:140px; height:140px; border-radius:50%;
                background:rgba(255,255,255,.15); display:none; touch-action:none; }
    #stick { position:absolute; left:45px; top:45px; width:50px; height:50px; border-radius:50%;
             background:rgba(255,255,255,.55); pointer-events:none; }
  </style>
</head>
<body>
  <button id="btn-toggle">✕</button>
  <div id="panel">
    <h3 style="margin:4px 0 8px;">Бродилка</h3>
    <button class="f" id="btn-create">Создать комнату</button>
    <input id="room-code" placeholder="Код комнаты (если есть)">
    <button class="f" id="btn-join">Присоединиться</button>
    <button class="f" id="btn-exit" style="display:none;">Выйти из игры</button>
    <div id="status"></div>
    <div id="code-line"></div>
    <p style="font-size:12px;color:#999;margin:8px 0 0;">Клавиши: WASD / стрелки. На телефоне — джойстик слева внизу.</p>
  </div>
  <div id="joystick"><div id="stick"></div></div>

  <!-- Два CDN: если первый не загрузится, пробуем второй -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
  <script>
    if (typeof Peer === 'undefined') {
      var s = document.createElement('script');
      s.src = 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
      document.head.appendChild(s);
    }
  </script>
  <script>
    const canvas = document.createElement('canvas');
    document.body.prepend(canvas);
    const ctx = canvas.getContext('2d');

    function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
    addEventListener('resize', resize); resize();

    // --- Мир ---
    const worldSize = 3000, tileSize = 64, tiles = [];
    for (let x = -10; x < 10; x++)
      for (let y = -10; y < 10; y++) {
        const type = Math.random() < 0.15 ? 'tree' : (Math.random() < 0.2 ? 'bush' : 'grass');
        tiles.push({ x, y, type });
      }

    // --- Игрок ---
    let player = { x: 0, y: 0, color: `hsl(${Math.floor(Math.random()*360)},70%,50%)` };
    const speed = 4;

    const keys = {};
    addEventListener('keydown', e => keys[e.code] = true);
    addEventListener('keyup', e => keys[e.code] = false);

    // --- Джойстик ---
    const joy = document.getElementById('joystick');
    const stick = document.getElementById('stick');
    let joyDX = 0, joyDY = 0;

    joy.addEventListener('pointerdown', e => { joy.setPointerCapture(e.pointerId); moveJoy(e); });
    joy.addEventListener('pointermove', e => { if (joy.hasPointerCapture(e.pointerId)) moveJoy(e); });
    joy.addEventListener('pointerup', resetJoy);
    joy.addEventListener('pointercancel', resetJoy);

    function moveJoy(e) {
      const r = joy.getBoundingClientRect();
      const cx = r.left + r.width/2, cy = r.top + r.height/2;
      let dx = e.clientX - cx, dy = e.clientY - cy;
      const dist = Math.hypot(dx, dy), max = r.width/2;
      if (dist > max) { dx = dx/dist*max; dy = dy/dist*max; }
      stick.style.transform = `translate(${dx}px,${dy}px)`;
      joyDX = dx/max; joyDY = dy/max;
    }
    function resetJoy() { joyDX = 0; joyDY = 0; stick.style.transform = ''; }

    function updatePlayer() {
      let dx = 0, dy = 0;
      if (keys['KeyW'] || keys['ArrowUp'] || keys['KeyЦ']) dy -= 1;
      if (keys['KeyS'] || keys['ArrowDown'] || keys['KeyЫ']) dy += 1;
      if (keys['KeyA'] || keys['ArrowLeft'] || keys['KeyФ']) dx -= 1;
      if (keys['KeyD'] || keys['ArrowRight'] || keys['KeyВ']) dx += 1;
      if (joyDX || joyDY) { dx += joyDX; dy += joyDY; }
      player.x = Math.max(-worldSize/2, Math.min(worldSize/2, player.x + dx*speed));
      player.y = Math.max(-worldSize/2, Math.min(worldSize/2, player.y + dy*speed));
    }

    // --- Сеть ---
    let peer = null, isHost = false, conns = [], otherPlayers = {}, sendTimer = null;
    const PREFIX = 'brodilka-';

    const statusEl = document.getElementById('status');
    const codeEl = document.getElementById('code-line');
    function setStatus(t, c = '#ccc') { statusEl.textContent = t; statusEl.style.color = c; }
    function showCode(code) { codeEl.textContent = code; codeEl.style.display = 'block'; }
    function hideCode() { codeEl.style.display = 'none'; codeEl.textContent = ''; }

    function netReady() {
      if (typeof Peer === 'undefined') {
        setStatus('Не удалось загрузить библиотеку связи. Проверь интернет и обнови страницу.', 'red');
        return false;
      }
      return true;
    }

    function makeRoomCode() {
      const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let s = '';
      for (let i = 0; i < 5; i++) s += abc[Math.floor(Math.random()*abc.length)];
      return s;
    }

    function createRoom() {
      if (!netReady()) return;
      cleanup();
      isHost = true;
      const code = makeRoomCode();
      setStatus('Соединяюсь с сервером связи…');
      peer = new Peer(PREFIX + code);
      peer.on('open', () => {
        showCode(code);
        setStatus('Код комнаты (скажи друзьям):');
        startGame();
      });
      peer.on('connection', c => handleConnection(c));
      peer.on('error', e => setStatus('Ошибка: ' + e.type, 'red'));
      failIfSlow();
    }

    function joinRoom() {
      if (!netReady()) return;
      const code = document.getElementById('room-code').value.trim().toUpperCase();
      if (!code) return setStatus('Введите код комнаты', 'red');
      cleanup();
      isHost = false;
      setStatus('Подключаюсь к комнате ' + code + '…');
      peer = new Peer();
      peer.on('open', () => {
        const c = peer.connect(PREFIX + code, { reliable: true });
        c.on('open', () => { handleConnection(c); startGame(); });
        c.on('error', () => setStatus('Не удалось подключиться. Проверь код.', 'red'));
        setTimeout(() => { if (!conns.length) setStatus('Комната не отвечает. Код верный? Создатель в игре?', 'red'); }, 8000);
      });
      peer.on('error', e => setStatus('Ошибка: ' + e.type + ' (комната не найдена?)', 'red'));
    }

    function handleConnection(c) {
      conns.push(c);
      c.on('data', data => {
        if (data.type === 'pos') {
          otherPlayers[data.id] = { x: data.x, y: data.y, color: data.color };
          // хост пересылает позиции дальше — чтобы видели все
          if (isHost) for (const o of conns) if (o !== c && o.open) o.send(data);
        } else if (data.type === 'left') {
          delete otherPlayers[data.id];
          if (isHost) for (const o of conns) if (o.open) o.send(data);
        }
      });
      c.on('close', () => {
        conns = conns.filter(x => x !== c);
        delete otherPlayers[c.peer];
      });
    }

    function broadcast(msg) {
      for (const c of conns) if (c.open) c.send(msg);
    }

    let timer;
    function failIfSlow() {
      clearTimeout(timer);
      timer = setTimeout(() => {
        if (peer && !peer.open) setStatus('Сервер связи не отвечает. Проверь интернет и попробуй ещё раз.', 'red');
      }, 10000);
    }

    function startGame() {
      setPanel(false);
      joy.style.display = 'block';
      clearInterval(sendTimer);
      sendTimer = setInterval(() => {
        if (peer && peer.open) broadcast({ type:'pos', id: peer.id, x: player.x, y: player.y, color: player.color });
      }, 100);
    }

    function cleanup() {
      clearInterval(sendTimer);
      for (const c of conns) { try { c.send({ type:'left', id: peer?.id }); c.close(); } catch(e){} }
      if (peer) try { peer.destroy(); } catch(e){}
      conns = []; otherPlayers = {}; peer = null;
      player.x = 0; player.y = 0;
    }

    function exitToMenu() {
      cleanup();
      setPanel(true);
      joy.style.display = 'none';
      hideCode();
      setStatus('');
    }

    document.getElementById('btn-create').onclick = createRoom;
    document.getElementById('btn-join').onclick = joinRoom;
    document.getElementById('btn-exit').onclick = exitToMenu;

    // --- Меню: убирается и показывается по кнопке ---
    const panel = document.getElementById('panel');
    const btnToggle = document.getElementById('btn-toggle');
    function setPanel(visible) {
      panel.style.display = visible ? 'block' : 'none';
      btnToggle.textContent = visible ? '✕' : '☰';
    }
    btnToggle.onclick = () => setPanel(panel.style.display === 'none');

    // --- Отрисовка ---
    function draw() {
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.translate(-player.x + canvas.width/2, -player.y + canvas.height/2);

      for (const t of tiles) {
        ctx.fillStyle = t.type === 'tree' ? '#228B22' : (t.type === 'bush' ? '#32CD32' : '#2E8B57');
        ctx.fillRect(t.x*tileSize, t.y*tileSize, tileSize, tileSize);
        if (t.type === 'tree') {
          ctx.fillStyle = '#8B4513';
          ctx.fillRect(t.x*tileSize+16, t.y*tileSize+32, 32, 32);
        }
      }
      for (const p of Object.values(otherPlayers)) {
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, 12, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
      }
      ctx.fillStyle = player.color;
      ctx.beginPath(); ctx.arc(player.x, player.y, 12, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
      ctx.restore();
    }

    (function loop() { updatePlayer(); draw(); requestAnimationFrame(loop); })();
  </script>
</body>
</html>
